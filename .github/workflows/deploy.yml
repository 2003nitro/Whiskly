name: Build and Deploy Recipe Book

on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: whiskly
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: whiskly/package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Configure git identity
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Build
              run: npx ng build --configuration=production --base-href=/Whiskly/

            - name: Show build output
              run: ls -R dist | head -40

            - name: Deploy to GitHub Pages
              run: npx angular-cli-ghpages --dir=dist/whiskly/browser
              env: 
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  